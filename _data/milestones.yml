- date: "2026-08"
  text: >-
    My paper [*Generalizing the Cauchy–Schwarz inequality: Hadamard powers and tensor products*](https://doi.org/10.1080/03081087.2026.2707240) with Dr. Johnston, Dr. Plosker, and Charles Torrance (a recent MtA graduate) is published in *Linear and Multilinear Algebra*

- date: "2026-07"
  text: >-
    I give a lightning talk at the [East Coast Combinatorics Conference](https://www.aarms.math.ca/events/east-coast-combinatorics-conference) on heuristic algorithms for weighted graph bandwidth (an in-progress project with Alexander Matheson, another undergrad at MtA)

- date: "2026-07"
  text: >-
    Dr. Johnston, Dr. Plosker, and I post [*Enumeration of Laplacian integral and {{MATH_1}}-diagonalizable graphs*](https://doi.org/10.48550/arXiv.2607.06336) on the arXiv (currently under review at *Discrete Applied Mathematics*)
