- date: "2026-07"
  text: >-
    Dr. Brett hires me back for two more months of summer research, this time to study game theory on social networks in addition to finalizing our public finance paper

- date: "2026-05"
  text: >-
    I officially complete my math honours thesis with Dr. Johnston (a year before graduation)

- date: "2026-04"
  text: >-
    I start my first summer of political science research (concurrently with my computer science grant) with [Dr. Wayne A. Hunt](https://mta.ca/directory/wayne-hunt), studying the political philosophy of technology & society

- date: "2026-03"
  text: >-
    I receive [a grant](https://mta.ca/current-students/experiences-and-career/student-research/independent-student-research-grants) to conduct an independent computer science research project of my choosing (namely, [my RNN project]({{LINK_1}})) for the summer
