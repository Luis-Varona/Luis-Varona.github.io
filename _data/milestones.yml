- date: "2026-03"
  text: >-
    I speak again at [AUPAC](https://event.fourwaves.com/2026aupac/pages) on heuristic algorithms for decomposing quantum states

- date: "2026-02"
  text: >-
    I post [*A polynomial-time algorithm for recognizing high-bandwidth graphs*](https://doi.org/10.48550/arXiv.2602.01755) (currently under revision for a v2 preprint and journal submission) on the arXiv

- date: "2026-01"
  text: >-
    I post [*Efficient spectral bounds on the chromatic number of Hamming, Johnson, and Kneser graph powers*](https://doi.org/10.48550/arXiv.2601.01962) (currently under review at the *Rose-Hulman Undergraduate Mathematics Journal*) on the arXiv with U of G student Finn Steinke

- date: "2025-12"
  text: >-
    [MatrixBandwidth.jl](https://luis-varona.github.io/MatrixBandwidth.jl/) (my scientific computing Julia package) is peer-reviewed and [published](https://doi.org/10.21105/joss.09136) in the *Journal of Open Source Software*

- date: "2025-10"
  text: >-
    My competitive programming team, the MTA Computer Cats, wins [3rd Place](https://scienceatlantic.ca/wp-content/uploads/Student-Awards-Yearbook-2025-2026/Student-Awards-Yearbook-2025-2026.html#page=10) at the Atlantic Canada Programming Competition

- date: "2025-10"
  text: >-
    I return to [Science Atlantic MSCS](https://event.fourwaves.com/mscs2025/pages) to give a talk on graph bandwidth algorithms, winning the [2nd Place Undergraduate Research Award for Computer Science](https://scienceatlantic.ca/wp-content/uploads/Student-Awards-Yearbook-2025-2026/Student-Awards-Yearbook-2025-2026.html#page=8)

- date: "2025-09"
  text: >-
    [Dr. Craig Brett](https://mta.ca/directory/craig-brett) hires me to do part-time economics research in public finance for the Fall term

- date: "2025-05"
  text: >-
